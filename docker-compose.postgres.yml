services:
  jellygate:
    image: ghcr.io/maelmoreau21/jellygate:latest
    container_name: jellygate
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    ports:
      - "${JELLYGATE_PORT:-8097}:8097"
    volumes:
      - jellygate_data:/data
    env_file:
      - .env
    environment:
      # ── Application ──────────────────────────────────────────────────
      - TZ=${TZ:-UTC}
      - JELLYGATE_PORT=8097
      - JELLYGATE_BASE_URL=${JELLYGATE_BASE_URL:-http://localhost:8097}
      - JELLYGATE_SECRET=${JELLYGATE_SECRET:?❌ JELLYGATE_SECRET is required}
      - JELLYGATE_LOCAL_ADMIN_USER=${JELLYGATE_LOCAL_ADMIN_USER:-admin}
      - JELLYGATE_LOCAL_ADMIN_PASSWORD=${JELLYGATE_LOCAL_ADMIN_PASSWORD:-}

      # ── OIDC & Identity Provider (SSO) ──────────────────────────────
      - OIDC_ENABLED=${OIDC_ENABLED:-true}
      - OIDC_URL=${OIDC_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_USER_GROUP=${OIDC_USER_GROUP:-jellygate-users}
      - OIDC_ADMIN_GROUP=${OIDC_ADMIN_GROUP:-jellygate-admins}

      # ── SQL Database (PostgreSQL) ───────────────────────────────────
      # When DB_HOST is set, PostgreSQL is automatically used
      - DB_HOST=${DB_HOST:-postgres}
      - DB_PORT=${DB_PORT:-5432}
      - DB_USER=${DB_USER:-${POSTGRES_USER:?❌ POSTGRES_USER or DB_USER is required}}
      - DB_PASSWORD=${DB_PASSWORD:-${POSTGRES_PASSWORD:?❌ POSTGRES_PASSWORD or DB_PASSWORD is required}}
      - DB_NAME=${DB_NAME:-${POSTGRES_DB:-jellygate}}
      - DB_SSLMODE=${DB_SSLMODE:-disable}

      # ── Jellyfin (Optional) ──────────────────────────────────────────
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}

      # ── Optional portal links ────────────────────────────────────────
      - JELLYSEERR_URL=${JELLYSEERR_URL:-}
      - JELLYTRACK_URL=${JELLYTRACK_URL:-}

    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8097/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:18-alpine
    container_name: jellygate-postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-${DB_NAME:-jellygate}}
      - POSTGRES_USER=${POSTGRES_USER:-${DB_USER:?❌ POSTGRES_USER is required}}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-${DB_PASSWORD:?❌ POSTGRES_PASSWORD is required}}
      - TZ=${TZ:-UTC}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-${DB_USER:-jellygate}} -d ${POSTGRES_DB:-${DB_NAME:-jellygate}}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  jellygate_data:
    driver: local
  postgres_data:
    driver: local
