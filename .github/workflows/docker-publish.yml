# =============================================================================
# JellyGate — Docker Publish & Integration (Multi-arch)
# =============================================================================
#
# Déclenché sur :
#   - Push / PR sur main & develop
#   - Nouveau tag vX.Y.Z → tags "vX.Y.Z" et "latest"
#
# Compile pour linux/amd64 et linux/arm64 via QEMU + Docker Buildx.
# Publie sur GitHub Container Registry (ghcr.io) uniquement lors des push.
# =============================================================================

name: Docker Publish

on:
  push:
    branches: [main, develop]
    tags: ['v*.*.*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/maelmoreau21/jellygate

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v6

      # ── 2. QEMU (émulation ARM pour cross-compilation) ───────────────────
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      # ── 3. Docker Buildx ────────────────────────────────────────────────
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # ── 4. Connexion à GHCR ─────────────────────────────────────────────
      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Extraction des métadonnées (tags + labels) ───────────────────
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=unstable,enable=${{ github.ref == 'refs/heads/develop' }}
            type=semver,pattern={{version}}

      # ── 5b. Test d'intégration avant publication ─────────────────────────
      - name: Build local image for validation
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: jellygate:publish-test
          cache-from: type=gha

      - name: Smoke test container
        shell: bash
        run: |
          docker run -d \
            --name jellygate-publish-test \
            -p 8097:8097 \
            -e JELLYGATE_SECRET=12345678901234567890123456789012 \
            -e JELLYFIN_URL=http://localhost:8096 \
            -e JELLYFIN_API_KEY=dummykeyforci \
            jellygate:publish-test
          
          echo "Attente du démarrage du conteneur..."
          success=0
          for i in $(seq 1 30); do
            if curl -s -f http://localhost:8097/health > /dev/null 2>&1 || curl -s -f http://localhost:8097/ > /dev/null 2>&1; then
              echo "✅ Conteneur démarré et répond correctement !"
              success=1
              break
            fi
            sleep 1
          done
          if [ "$success" -ne 1 ]; then
            echo "❌ Le conteneur n'a pas répondu à temps."
            docker logs jellygate-publish-test
            exit 1
          fi
          docker rm -f jellygate-publish-test 2>/dev/null || true

      - name: Display Container Logs on Failure
        if: failure()
        run: docker logs jellygate-publish-test 2>&1 || true

      # ── 6. Build & Push multi-architecture (seulement lors d'un Push) ───
      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
