services:
  jellygate:
    build: .
    image: ghcr.io/maelmoreau21/jellygate:latest
    container_name: jellygate
    user: "${PUID:-1000}:${PGID:-1000}"
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,noexec,nosuid,nodev
    ports:
      - "${JELLYGATE_PORT:-8097}:8097"
    volumes:
      - ./data:/data
    env_file:
      - .env
    environment:
      # ── Application ──────────────────────────────────────────────────
      - TZ=${TZ:-UTC}
      - JELLYGATE_PORT=8097
      - JELLYGATE_BASE_URL=${JELLYGATE_BASE_URL:-http://localhost:8097}
      - JELLYGATE_SECRET=${JELLYGATE_SECRET:?❌ JELLYGATE_SECRET is required}
      - JELLYGATE_LOCAL_ADMIN_USER=${JELLYGATE_LOCAL_ADMIN_USER:-admin}
      - JELLYGATE_LOCAL_ADMIN_PASSWORD=${JELLYGATE_LOCAL_ADMIN_PASSWORD:-}

      # ── OIDC & Identity Provider (SSO) ──────────────────────────────
      - OIDC_ENABLED=${OIDC_ENABLED:-true}
      - OIDC_URL=${OIDC_URL:-}
      - OIDC_CLIENT_ID=${OIDC_CLIENT_ID:-}
      - OIDC_CLIENT_SECRET=${OIDC_CLIENT_SECRET:-}
      - OIDC_USER_GROUP=${OIDC_USER_GROUP:-jellygate-users}
      - OIDC_ADMIN_GROUP=${OIDC_ADMIN_GROUP:-jellygate-admins}

      # ── Jellyfin (Optional - can also be configured in App UI) ────────
      - JELLYFIN_URL=${JELLYFIN_URL:-}
      - JELLYFIN_API_KEY=${JELLYFIN_API_KEY:-}

      # ── Optional portal links ────────────────────────────────────────
      - JELLYSEERR_URL=${JELLYSEERR_URL:-}
      - JELLYTRACK_URL=${JELLYTRACK_URL:-}

    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8097/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
